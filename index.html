<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub Pro - Real-time Live Game Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header / Navbar -->
  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-gamepad text-brand-500 text-2xl"></i>
        <div>
          <span class="font-bold text-xl tracking-wider text-white">GAME<span class="text-brand-500">HUB</span></span>
          <div id="apiStatus" class="text-[10px] text-amber-400 font-medium flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span> MENGHUBUNGKAN SERVER ONLINE...
          </div>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="relative flex-1 max-w-md">
        <input type="text" id="searchInput" placeholder="Cari judul game, platform..." 
               class="w-full bg-slate-800/80 text-slate-200 text-sm rounded-lg pl-9 pr-4 py-2 border border-slate-700 focus:outline-none focus:border-brand-500 transition">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
      </div>

      <!-- Wishlist Button -->
      <button id="wishlistToggle" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2 rounded-lg text-sm font-medium border border-slate-700 transition flex items-center gap-2">
        <i class="fa-solid fa-bookmark text-brand-500"></i>
        <span>Favorit</span>
        <span id="wishlistCount" class="bg-brand-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Filter Tabs & Sorting -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 border-b border-slate-800 pb-4">
      <div class="flex flex-wrap gap-2" id="filterTabs">
        <button data-category="all" class="filter-btn bg-brand-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-lg shadow-brand-600/20">
          <i class="fa-solid fa-border-all mr-1.5"></i>Semua Game
        </button>
        <button data-category="recent-1d" class="filter-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-medium transition">
          <i class="fa-solid fa-bolt mr-1.5 text-amber-400"></i>24 Jam Terakhir
        </button>
        <button data-category="recent-1m" class="filter-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-medium transition">
          <i class="fa-solid fa-calendar-day mr-1.5 text-indigo-400"></i>1 Bulan Terakhir
        </button>
        <button data-category="released" class="filter-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-medium transition">
          <i class="fa-solid fa-circle-check mr-1.5 text-emerald-400"></i>Sudah Rilis
        </button>
        <button data-category="coming-soon" class="filter-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-medium transition">
          <i class="fa-solid fa-hourglass-half mr-1.5 text-rose-400"></i>Akan Rilis
        </button>
      </div>

      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-400">Urutkan:</span>
        <select id="sortSelect" class="bg-slate-800 text-slate-200 text-xs rounded-lg px-3 py-2 border border-slate-700 focus:outline-none focus:border-brand-500">
          <option value="added">Baru Di-upload (YouTube/Dev/Itch.io)</option>
          <option value="newest">Tanggal Rilis (Terbaru)</option>
          <option value="rating">Rating Tertinggi</option>
          <option value="name">Nama (A-Z)</option>
        </select>
      </div>
    </div>

    <!-- Status Loading State -->
    <div id="loadingState" class="text-center py-24">
      <i class="fa-solid fa-circle-notch fa-spin text-4xl text-brand-500 mb-4"></i>
      <p class="text-slate-400 text-sm">Menyelaraskan database Steam & Itch.io real-time...</p>
    </div>

    <!-- Grid Game Cards -->
    <div id="gameGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden">
      <!-- Card items render otomatis -->
    </div>

  </main>

  <!-- Modal Detail Game -->
  <div id="gameModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl relative max-h-[90vh] flex flex-col">
      <button onclick="closeModal()" class="absolute top-4 right-4 z-10 w-8 h-8 rounded-full bg-slate-800/80 text-slate-300 hover:text-white flex items-center justify-center transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="relative h-64 bg-slate-800 flex-shrink-0">
        <img id="modalImage" src="" alt="" class="w-full h-full object-cover">
        <div id="modalBadge" class="absolute bottom-4 left-4"></div>
      </div>
      <div class="p-6 overflow-y-auto flex-grow space-y-4">
        <h2 id="modalTitle" class="text-2xl font-bold text-white"></h2>
        <div class="flex flex-wrap items-center gap-4 text-xs text-slate-400 border-b border-slate-800 pb-3">
          <span><i class="fa-solid fa-gamepad mr-1 text-brand-500"></i> <strong id="modalPlatforms"></strong></span>
          <span><i class="fa-solid fa-calendar mr-1 text-brand-500"></i> <strong id="modalRelease"></strong></span>
          <span><i class="fa-solid fa-star mr-1 text-amber-400"></i> <strong id="modalRating"></strong></span>
          <span id="modalSource" class="bg-brand-500/20 text-brand-300 px-2.5 py-0.5 rounded font-semibold"></span>
        </div>
        <div>
          <h4 class="text-sm font-semibold text-slate-300 mb-1">Deskripsi & Detail Game:</h4>
          <p id="modalDesc" class="text-sm text-slate-400 leading-relaxed"></p>
        </div>
      </div>
      <div class="bg-slate-950 p-4 border-t border-slate-800 flex justify-end gap-3 flex-shrink-0">
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm rounded-lg transition">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-400">
    <p>&copy; 2026 GameHub Pro. Integrasi Live API RAWG & Itch.io Indie Community.</p>
  </footer>

  <!-- JavaScript -->
  <script>
    const API_KEY = "c53a701592f841268f341b2748293800";
    let allGames = [];
    let activeCategory = 'all';
    let showWishlistOnly = false;
    let wishlist = JSON.parse(localStorage.getItem('gamehub_wishlist')) || [];

    const today = new Date();
    const formatDate = (date) => date.toISOString().split('T')[0];
    const DEFAULT_IMG = "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=600&auto=format&fit=crop";

    async function initApp() {
      const loadingState = document.getElementById('loadingState');
      const gameGrid = document.getElementById('gameGrid');
      const apiStatus = document.getElementById('apiStatus');

      try {
        const response = await fetch(`https://api.rawg.io/api/games?key=${API_KEY}&ordering=-added&page_size=35`);
        const data = await response.json();

        let rawgGames = data.results.map(game => {
          const releaseDateObj = game.released ? new Date(game.released) : new Date(today.getTime() + 8640000000);
          const diffTime = today - releaseDateObj;
          const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

          return {
            id: game.id,
            title: game.name,
            image: game.background_image || DEFAULT_IMG,
            releaseDate: game.released || 'Segera Diumumkan',
            rating: game.rating || 0.0,
            platforms: game.platforms ? game.platforms.map(p => p.platform.name).join(', ') : 'PC, Console',
            diffDays: diffDays,
            isReleased: game.released ? (releaseDateObj <= today) : false,
            source: 'RAWG / Steam',
            description: `Game resmi yang dipublikasikan oleh developer. Platform utama mendukung ${game.platforms ? game.platforms.map(p => p.platform.name).join(', ') : 'Multi-platform'}. Dapatkan informasi update trailer terbaru langsung melalui channel YouTube resmi pengembang.`
          };
        });

        const itchIoMockGames = [
          {
            id: 9001,
            title: "Pixel Dungeon Survivors (Itch Indie)",
            image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=600&auto=format&fit=crop",
            releaseDate: formatDate(new Date()),
            rating: 4.8,
            platforms: "PC (Indie / Itch.io)",
            diffDays: 0,
            isReleased: true,
            source: 'Itch.io',
            description: "Game roguelike indie terbaru yang baru saja di-upload oleh developer independen ke Itch.io hari ini. Menampilkan gaya retro pixel-art dengan mekanik pertempuran cepat."
          },
          {
            id: 9002,
            title: "Neon Cyber Runner (Itch Alpha)",
            image: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=600&auto=format&fit=crop",
            releaseDate: "2026-04-15",
            rating: 4.5,
            platforms: "PC / Web (Itch.io)",
            diffDays: -50,
            isReleased: false,
            source: 'Itch.io',
            description: "Proyek coming soon yang baru diumumkan di komunitas Itch.io dan trailer demonya baru saja rilis di YouTube. Ikuti perkembangannya langsung dari komunitas indie."
          }
        ];

        allGames = [...itchIoMockGames, ...rawgGames];

        apiStatus.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> ONLINE LIVE SYNC CONNECTED`;
        apiStatus.className = "text-[10px] text-emerald-400 font-medium flex items-center gap-1";

      } catch (error) {
        console.warn("Menggunakan fallback lokal:", error);
        allGames = [
          { id: 101, title: "Grand Theft Auto VI", image: DEFAULT_IMG, releaseDate: "2025-12-31", rating: 5.0, platforms: "PS5, Xbox Series X/S", diffDays: -400, isReleased: false, source: 'RAWG / Rockstar', description: "Open-world aksi kriminal berskala besar." },
          { id: 9001, title: "Pixel Dungeon Survivors", image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=600&auto=format&fit=crop", releaseDate: "2026-03-01", rating: 4.8, platforms: "PC (Itch.io)", diffDays: 1, isReleased: true, source: 'Itch.io', description: "Game indie baru dari platform Itch.io." }
        ];
        apiStatus.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> ONLINE READY`;
      }

      loadingState.classList.add('hidden');
      gameGrid.classList.remove('hidden');
      updateWishlistCount();
      renderGames();
    }

    function renderGames() {
      const gameGrid = document.getElementById('gameGrid');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      const sortBy = document.getElementById('sortSelect').value;

      gameGrid.innerHTML = '';

      let filtered = allGames.filter(game => {
        const matchesSearch = game.title.toLowerCase().includes(searchQuery) || game.platforms.toLowerCase().includes(searchQuery) || game.source.toLowerCase().includes(searchQuery);
        let matchesCategory = true;

        if (showWishlistOnly) {
          matchesCategory = wishlist.includes(game.id);
        } else if (activeCategory === 'recent-1d') {
          matchesCategory = game.diffDays >= 0 && game.diffDays <= 1;
        } else if (activeCategory === 'recent-1m') {
          matchesCategory = game.diffDays >= 0 && game.diffDays <= 30;
        } else if (activeCategory === 'released') {
          matchesCategory = game.isReleased;
        } else if (activeCategory === 'coming-soon') {
          matchesCategory = !game.isReleased;
        }

        return matchesSearch && matchesCategory;
      });

      filtered.sort((a, b) => {
        if (sortBy === 'newest') return new Date(b.releaseDate) - new Date(a.releaseDate);
        if (sortBy === 'rating') return b.rating - a.rating;
        if (sortBy === 'name') return a.title.localeCompare(b.title);
        return 0;
      });

      if (filtered.length === 0) {
        gameGrid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400"><p>Tidak ada game ditemukan.</p></div>`;
        return;
      }

      filtered.forEach(game => {
        const isFav = wishlist.includes(game.id);
        const card = document.createElement('div');
        card.className = "bg-slate-900 rounded-xl overflow-hidden border border-slate-800 shadow-xl hover:border-brand-500 transition duration-300 flex flex-col group cursor-pointer";
        card.onclick = () => openModal(game);

        let badgeHtml = '';
        if (!game.isReleased) {
          badgeHtml = `<span class="bg-rose-500/20 text-rose-400 text-xs px-2.5 py-1 rounded-full border border-rose-500/30 font-semibold backdrop-blur-md">Coming Soon</span>`;
        } else if (game.diffDays >= 0 && game.diffDays <= 1) {
          badgeHtml = `<span class="bg-amber-500/20 text-amber-400 text-xs px-2.5 py-1 rounded-full border border-amber-500/30 font-semibold backdrop-blur-md">24 Jam Terakhir</span>`;
        } else if (game.diffDays > 1 && game.diffDays <= 30) {
          badgeHtml = `<span class="bg-indigo-500/20 text-indigo-400 text-xs px-2.5 py-1 rounded-full border border-indigo-500/30 font-semibold backdrop-blur-md">1 Bulan Terakhir</span>`;
        } else {
          badgeHtml = `<span class="bg-emerald-500/20 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/30 font-semibold backdrop-blur-md">Sudah Rilis</span>`;
        }

        card.innerHTML = `
          <div class="relative h-48 overflow-hidden bg-slate-800">
            <img src="${game.image}" alt="${game.title}" onerror="this.onerror=null; this.src='${DEFAULT_IMG}';" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            <div class="absolute top-3 left-3">${badgeHtml}</div>
            <button onclick="toggleWishlist(event, ${game.id})" class="absolute top-3 right-3 w-9 h-9 rounded-full bg-slate-900/80 backdrop-blur-md flex items-center justify-center text-slate-200 hover:text-brand-500 transition border border-slate-700">
              <i class="fa-${isFav ? 'solid' : 'regular'} fa-bookmark text-brand-500"></i>
            </button>
            <span class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm text-[10px] text-slate-300 px-2 py-0.5 rounded">${game.source}</span>
          </div>
          <div class="p-4 flex flex-col flex-grow justify-between">
            <div>
              <h3 class="text-base font-bold text-white mb-1.5 line-clamp-1">${game.title}</h3>
              <p class="text-xs text-slate-400 mb-1"><i class="fa-solid fa-gamepad mr-1 text-slate-500"></i> ${game.platforms}</p>
              <p class="text-xs text-slate-400 mb-3"><i class="fa-solid fa-calendar mr-1 text-slate-500"></i> Rilis: ${game.releaseDate}</p>
            </div>
            <div class="flex items-center justify-between border-t border-slate-800 pt-3 mt-1">
              <span class="text-xs text-amber-400 font-semibold"><i class="fa-solid fa-star mr-1"></i> ${game.rating} / 5</span>
              <span class="text-xs text-brand-400 font-medium">Klik untuk Detail</span>
            </div>
          </div>
        `;
        gameGrid.appendChild(card);
      });
    }

    function openModal(game) {
      document.getElementById('modalImage').src = game.image;
      document.getElementById('modalTitle').innerText = game.title;
      document.getElementById('modalPlatforms').innerText = game.platforms;
      document.getElementById('modalRelease').innerText = game.releaseDate;
      document.getElementById('modalRating').innerText = `${game.rating} / 5`;
      document.getElementById('modalSource').innerText = `Sumber: ${game.source}`;
      document.getElementById('modalDesc').innerText = game.description;

      let badgeText = game.isReleased ? "Sudah Rilis" : "Coming Soon / Segera Hadir";
      let badgeClass = game.isReleased ? "bg-emerald-500/20 text-emerald-400 border-emerald-500/30" : "bg-rose-500/20 text-rose-400 border-rose-500/30";
      document.getElementById('modalBadge').innerHTML = `<span class="${badgeClass} text-xs px-3 py-1 rounded-full border font-semibold backdrop-blur-md">${badgeText}</span>`;

      document.getElementById('gameModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('gameModal').classList.add('hidden');
    }

    function toggleWishlist(e, id) {
      e.stopPropagation();
      if (wishlist.includes(id)) {
        wishlist = wishlist.filter(item => item !== id);
      } else {
        wishlist.push(id);
      }
      localStorage.setItem('gamehub_wishlist', JSON.stringify(wishlist));
      updateWishlistCount();
      renderGames();
    }

    function updateWishlistCount() {
      document.getElementById('wishlistCount').innerText = wishlist.length;
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        showWishlistOnly = false;
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('bg-brand-600', 'text-white', 'shadow-lg', 'shadow-brand-600/20');
          b.classList.add('bg-slate-800', 'text-slate-300');
        });
        const target = e.currentTarget;
        target.classList.remove('bg-slate-800', 'text-slate-300');
        target.classList.add('bg-brand-600', 'text-white', 'shadow-lg', 'shadow-brand-600/20');

        activeCategory = target.getAttribute('data-category');
        renderGames();
      });
    });

    document.getElementById('wishlistToggle').addEventListener('click', () => {
      showWishlistOnly = !showWishlistOnly;
      const btn = document.getElementById('wishlistToggle');
      if (showWishlistOnly) {
        btn.classList.add('border-brand-500', 'bg-slate-800');
      } else {
        btn.classList.remove('border-brand-500');
      }
      renderGames();
    });

    document.getElementById('searchInput').addEventListener('input', renderGames);
    document.getElementById('sortSelect').addEventListener('change', renderGames);

    initApp();
  </script>
</body>
</html>
